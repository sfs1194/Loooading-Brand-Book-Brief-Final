<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zellije Workshop — Story 1080x1920</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>
  html, body { margin: 0; background: #111; }
  /* Zones de sécurité Instagram : ~250px en haut, ~340px en bas */
  .frame { width: 1080px; height: 1920px; background: var(--md-green); color: var(--md-white); position: relative; overflow: hidden; box-sizing: border-box; padding: 250px 100px 300px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .top .logo-md { width: 420px; }
  .top .tag { color: var(--md-gold); font-size: 22px; letter-spacing: .08em; text-align: right; line-height: 1.25; margin-top: 6px; }
  .main { margin-top: 120px; position: relative; }
  .eyebrow { color: var(--md-gold); font-size: 28px; letter-spacing: .14em; margin-bottom: 30px; }
  h1.wide { font-weight: 500; font-size: 112px; line-height: .9; margin: 0 0 44px; }
  .sub { color: var(--md-gold); font-size: 38px; line-height: .98; margin: 0; max-width: 820px; }
  .sessions { margin-top: 64px; border-top: 3px solid var(--md-gold); }
  .s { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; border-bottom: 3px solid var(--md-gold); }
  .s .d { color: var(--md-gold); font-size: 28px; letter-spacing: .06em; line-height: 1.35; }
  .s .d small { display: block; color: var(--md-white); font-size: 21px; letter-spacing: .1em; opacity: .85; }
  .s .h { font-size: 96px; line-height: 1; }
  .book { margin-top: 52px; display: flex; align-items: center; justify-content: space-between; background: var(--md-gold); color: var(--md-green-deep); padding: 30px 36px 28px; }
  .book .t { font-size: 34px; }
  .book .u { font-size: 20px; letter-spacing: .08em; }
  .partners { margin-top: auto; gap: 30px; color: var(--md-white); font-size: 20px; justify-content: space-between; padding-top: 34px; border-top: 1px solid var(--md-green-line); }
  .partners .logo-flexform { height: 62px; width: auto; }
  .partners .logo-zellijist { height: 48px; width: auto; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="top">
    <img class="logo logo-md" src="../assets/logos/morocco-design.svg" alt="Morocco Design">
    <div class="tag caps">Casablanca<br>Oct 5 — 7</div>
  </div>

  <div class="main">
    <div class="eyebrow caps">Back by popular demand</div>
    <h1 class="wide">Zellije<br>Workshop</h1>
    <p class="sub caps">Two exceptional new sessions with The Zellijist at Flexform.</p>

    <div class="sessions">
      <div class="s">
        <div class="d caps">Tuesday · Oct 6<small>Flexform · Casablanca</small></div>
        <div class="h wide">12:00</div>
      </div>
      <div class="s">
        <div class="d caps">Wednesday · Oct 7<small>Flexform · Casablanca</small></div>
        <div class="h wide">15:00</div>
      </div>
    </div>

    <div class="book">
      <span class="t wide">Places limitées<br>Réservez&nbsp;↗</span>
      <span class="u caps">thezellijist.com<br>/flexform</span>
    </div>
  </div>

  <div class="partners">
    <img class="logo logo-zellijist" src="../assets/logos/the-zellijist-blanc.png" alt="The Zellijist">
    <img class="logo logo-flexform" src="../assets/logos/flexform.png" alt="Flexform">
  </div>
</div>
</body>
</html>
